{% extends "base.html" %}{% block body %}<h1>Stock (auto-delivery items)</h1><div class=card><form method=post><select name=product_id>{% for p in prods %}<option value={{p.id}}>{{p.name}}</option>{% endfor %}</select><textarea name=content rows=6 placeholder="One delivery item per line — e.g. a licence key / voucher code you own"></textarea><button>Add stock</button></form></div><table><tr><th>ID</th><th>Product</th><th>Content</th><th>Sold?</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.name}}</td><td>{{r.content}}</td><td>{{r.is_sold}}</td></tr>{% endfor %}</table>{% endblock %}
