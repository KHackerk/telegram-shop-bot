<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>{{shop}} Admin</title>
<style>
*{box-sizing:border-box}
:root{--glass:rgba(255,255,255,.028);--stroke:rgba(10,140,80,.55);--txt:#f2f7f3;--dim:rgba(226,240,231,.62);--green:#22c55e;--deep:#065f46}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);margin:0;min-height:100vh;background:#000}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:#000}
@keyframes floatUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.glass,.card,table{background:var(--glass);border:1px solid var(--stroke);border-radius:20px;box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.sidebar{position:fixed;left:14px;top:14px;bottom:14px;width:224px;z-index:20;display:flex;flex-direction:column;gap:2px;padding:16px 12px;border-radius:22px;background:#000;border:1px solid var(--stroke);box-shadow:0 18px 44px rgba(0,0,0,.55);overflow-y:auto;animation:fadeIn .8s ease both}
.sidebar .brand{font-weight:700;font-size:17px;padding:4px 10px 14px}
.sidebar a{color:var(--txt);text-decoration:none;padding:10px 12px;border-radius:12px;font-size:14.5px;display:flex;align-items:center;gap:11px;transition:all .25s cubic-bezier(.22,1,.36,1)}
.nav-ic{width:19px;height:19px;flex:none;opacity:.92}
.brand{display:flex;align-items:center;gap:9px}.brand svg{width:20px;height:20px;flex:none;color:var(--green)}
.h-ic{width:.92em;height:.92em;vertical-align:-.1em;margin-right:7px}
.stat .icon svg{width:21px;height:21px}
.sidebar a:hover{background:rgba(34,197,94,.14);transform:translateX(3px)}
.sidebar .spacer{flex:1}
.wrap{max-width:1080px;margin:0 auto;margin-left:262px;padding:22px 16px 44px}
@media(max-width:900px){.sidebar{position:static;width:auto;margin:12px;flex-direction:row;flex-wrap:wrap;align-items:center}.sidebar .brand{padding:4px 8px}.sidebar .spacer{display:none}.wrap{margin-left:0}}
h1{font-size:clamp(26px,4vw,40px);margin:8px 0 4px;animation:floatUp .6s cubic-bezier(.22,1,.36,1) both}
.sub{color:var(--dim);animation:floatUp .6s .06s cubic-bezier(.22,1,.36,1) both}
.card{padding:18px;margin:14px 0;animation:floatUp .6s cubic-bezier(.22,1,.36,1) both}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:16px 0}
.stat{padding:20px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);box-shadow:0 18px 44px rgba(0,0,0,.45);animation:floatUp .6s cubic-bezier(.22,1,.36,1) both}
.stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}
.stat .row{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:14px}
.stat h2{font-size:30px;margin:10px 0 6px}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,rgba(34,197,94,.35),rgba(6,95,70,.25));color:#bbf7d0}
.up{color:var(--green);font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;animation:floatUp .6s .08s cubic-bezier(.22,1,.36,1) both}
td,th{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;color:var(--txt)}
tr{transition:background .25s}tr:hover{background:rgba(34,197,94,.06)}
input,select,textarea{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;width:100%;margin:6px 0;outline:none;transition:all .25s}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.4)}
input:focus,select:focus,textarea:focus{background:rgba(255,255,255,.08);border-color:rgba(34,197,94,.65)}
option{color:#111}
button,.btn{background:linear-gradient(135deg,#0da35c,#065f46);color:#fff;border:0;padding:10px 18px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:600;box-shadow:0 8px 22px rgba(6,95,70,.45);transition:all .3s cubic-bezier(.22,1,.36,1)}
button:hover,.btn:hover{transform:translateY(-2px)}
.red{background:linear-gradient(135deg,#f87171,#b91c1c);box-shadow:0 8px 22px rgba(185,28,28,.35)}
a{color:#6ee7a3}
@media(max-width:640px){.stat h2{font-size:25px}}
</style>

 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</a><a href=/admin/topups><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Top-ups</a><a href=/admin/bot-ui><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="19" cy="18" r="2"/></svg>Bot UI</a><a href=/admin/support><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>Support</a><a href=/admin/reports><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>Customer reports</a><div class=spacer></div><a href=/logout><svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Logout</a></aside>
<div class=wrap>{% block body %}{% endblock %}</div>
