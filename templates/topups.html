{% extends "base.html" %}{% block body %}<h1>Top-up requests</h1><table><tr><th>ID</th><th>User</th><th>Amount</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.user_id}}</td><td>{{money(r.amount_cents)}}</td><td>{{r.status}}</td><td>{% if r.status=='pending' %}<a class=btn href="/admin/topups/{{r.id}}/approve">Approve</a> <a class="btn red" href="/admin/topups/{{r.id}}/reject">Reject</a>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
