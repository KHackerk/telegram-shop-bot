{% extends "base.html" %}{% block body %}<h1>Categories</h1><div class=card><form method=post><input name=emoji placeholder="Emoji e.g. 🤖" style="width:120px"><input name=name placeholder="Category name" required><button>Add category</button></form></div><table>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.emoji}} {{r.name}}</td><td><a class="btn red" href="/admin/categories/{{r.id}}/delete">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
