<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Login — {{shop}}</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;color:#f2f7f3;margin:0;min-height:100vh;display:grid;place-items:center;background:#000}
@keyframes floatUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
form{width:min(360px,92vw);padding:28px;border-radius:24px;background:#050505;border:1px solid rgba(10,140,80,.55);box-shadow:0 24px 60px rgba(0,0,0,.55);animation:floatUp .7s cubic-bezier(.22,1,.36,1) both}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:12px;font-size:15px}
input{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;outline:none}input::placeholder{color:rgba(255,255,255,.4)}input:focus{border-color:rgba(34,197,94,.65)}
button{background:linear-gradient(135deg,#0da35c,#065f46);color:#fff;border:0;cursor:pointer;font-weight:700;box-shadow:0 10px 26px rgba(6,95,70,.45);transition:all .3s}button:hover{transform:translateY(-2px)}
p{color:rgba(226,240,231,.6);font-size:13px}
</style>
<form method=post><h2><svg style="width:20px;height:20px;vertical-align:-3px;margin-right:7px;color:#22c55e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/></svg>{{shop}} — Admin Login</h2>{% with m=get_flashed_messages() %}{% if m %}<p>{{m[0]}}</p>{% endif %}{% endwith %}<input type=password name=password placeholder="Admin password"><button>Login</button><p>Password is the ADMIN_PASSWORD set on Render.</p></form>
