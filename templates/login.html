<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Login — {{shop}}</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#7fa8cf,#d9b48c 55%,#5e4633)}
@keyframes floatUp{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
form{width:min(360px,92vw);padding:28px;border-radius:24px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.38);box-shadow:0 24px 60px rgba(10,20,35,.35);animation:floatUp .8s cubic-bezier(.22,1,.36,1) both;transition:transform .35s}
form:hover{transform:translateY(-5px)}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:12px;font-size:15px}
input{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);color:#fff;outline:none}input::placeholder{color:rgba(255,255,255,.6)}
button{background:linear-gradient(135deg,#2fd673,#16a34a);color:#fff;border:0;cursor:pointer;font-weight:700;box-shadow:0 10px 26px rgba(22,163,74,.4);transition:all .3s}button:hover{transform:translateY(-2px) scale(1.02)}
p{color:rgba(255,255,255,.75);font-size:13px}
</style>
<form method=post><h2>✦ {{shop}} — Admin Login</h2>{% with m=get_flashed_messages() %}{% if m %}<p>{{m[0]}}</p>{% endif %}{% endwith %}<input type=password name=password placeholder="Admin password"><button>Login</button><p>Password is the ADMIN_PASSWORD set on Render.</p></form>
