{% extends "base.html" %}{% block body %}<h1>Users</h1><table><tr><th>Telegram ID</th><th>User</th><th>Tier</th><th>Balance</th><th>Spent</th><th>Adjust balance ($)</th></tr>{% for r in rows %}<tr><td>{{r.telegram_id}}</td><td>@{{r.username}} {{r.first_name}}</td><td>{{tier(r.total_spent_cents)}}</td><td>{{money(r.balance_cents)}}</td><td>{{money(r.total_spent_cents)}}</td><td><form method=post action="/admin/users/{{r.telegram_id}}/balance"><input name=amount placeholder="+10 or -5" style="width:100px"><button>Apply</button></form></td></tr>{% endfor %}</table>{% endblock %}
