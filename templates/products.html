{% extends "base.html" %}{% block body %}<h1>Products</h1><div class=card><form method=post><select name=category_id>{% for c in cats %}<option value={{c.id}}>{{c.name}}</option>{% endfor %}</select><input name=name placeholder="Product name" required><input name=description placeholder="Description"><input name=price placeholder="Price USD e.g. 10.00" required><button>Add product</button></form></div><table><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.name}}</td><td>{{r.cat}}</td><td>{{money(r.price_cents)}}</td><td>{{r.stock}}</td><td><a class="btn red" href="/admin/products/{{r.id}}/delete">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
