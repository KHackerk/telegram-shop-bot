{% extends "base.html" %}{% block body %}<h1>Products</h1><div class=card><form method=post><select name=category_id>{% for c in cats %}<option value={{c.id}}>{{c.name}}</option>{% endfor %}</select><input name=name placeholder="Product name" required><input name=description placeholder="Description"><input name=price placeholder="Price MMK e.g. 5000" required><button>Add product</button></form></div><table><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.name}}</td><td>{{r.cat}}</td><td>{{money(r.price_cents)}}</td><td>{% if r.stock and r.stock > 0 %}{{r.stock}}{% else %}<span style="background:linear-gradient(135deg,#f87171,#dc2626);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600">Out of stock</span>{% endif %}</td><td><a class="btn red" href="/admin/products/{{r.id}}/delete">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
