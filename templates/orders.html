{% extends "base.html" %}{% block body %}<h1>Orders</h1>{% for r in rows %}<div class=card><b>#{{r.id}}</b> {{r.name}} — {{money(r.price_cents)}} — <b>{{r.status}}</b> — user {{r.user_id}}<form method=post><input type=hidden name=order_id value={{r.id}}><select name=status><option>pending</option><option>delivered</option><option>confirmed</option><option>cancelled</option></select><input name=delivery placeholder="Delivery text / note" value="{{r.delivery}}"><button>Update & notify user</button></form></div>{% endfor %}{% endblock %}
